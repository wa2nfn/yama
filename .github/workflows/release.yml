name: YAMA Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          
      - name: Build YAMA
        shell: bash
        run: |
          mkdir -p build
          
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export CGO_ENABLED=0
            export GOOS=windows
            export GOARCH=amd64
            go build -ldflags="-w -s" -o build/yama.exe .
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            export CGO_ENABLED=1
            export GOOS=darwin
            export GOARCH=amd64
            go build -ldflags="-w -s" -o build/yama-macos .
          else
            # Build Linux inside Ubuntu 20.04 (glibc 2.31) and install Go 1.26 on the fly for max compatibility
            docker run --rm -v ${{ github.workspace }}:/app -w /app ubuntu:20.04 bash -c "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y wget ca-certificates build-essential libasound2-dev && wget -q https://go.dev/dl/go1.26.0.linux-amd64.tar.gz && tar -C /usr/local -xzf go1.26.0.linux-amd64.tar.gz && export PATH=\$PATH:/usr/local/go/bin && env CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags='-w -s' -o build/yama-linux ."
          fi
          
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
         files: build/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
