name: YAMA Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build YAMA
        shell: bash
        run: |
          mkdir -p build
          
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export CGO_ENABLED=0
            export GOOS=windows
            export GOARCH=amd64
            go build -ldflags="-w -s" -o build/yama.exe .
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            export CGO_ENABLED=1
            export GOOS=darwin
            export GOARCH=amd64
            go build -ldflags="-w -s" -o build/yama-darwin .
          else
            # Build Linux inside older Debian container (glibc 2.31) using Archive repos
            docker run --rm -v ${{ github.workspace }}:/app -w /app golang:1.22-bullseye bash -c "rm -f /etc/apt/sources.list.d/* && echo 'deb http://archive.debian.org/debian bullseye main' > /etc/apt/sources.list && echo 'deb http://archive.debian.org/debian-security bullseye-security main' >> /etc/apt/sources.list && apt-get update -o Acquire::Check-Valid-Until=false && apt-get install -y libasound2-dev && env CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags='-w -s' -o build/yama-linux ."
          fi
          fi
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
         files: build/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
