
name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '>=1.20'

      - name: Build and Package
        run: |
          # 1. Windows (Intel/AMD)
          GOOS=windows GOARCH=amd64 go build -o yama.exe .
          zip yama-windows-amd64.zip yama.exe README.md
          rm yama.exe
          
          # 2. Linux (Intel/AMD)
          GOOS=linux GOARCH=amd64 go build -o yama .
          tar -czvf yama-linux-amd64.tar.gz yama README.md
          
          # 3. macOS (Intel)
          GOOS=darwin GOARCH=amd64 go build -o yama .
          zip yama-mac-intel.zip yama README.md
          
          # 4. macOS (Apple Silicon / M1 / M2 / M3)
          GOOS=darwin GOARCH=arm64 go build -o yama .
          zip yama-mac-arm64.zip yama README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            yama-windows-amd64.zip
            yama-linux-amd64.tar.gz
            yama-mac-intel.zip
            yama-mac-arm64.zip
